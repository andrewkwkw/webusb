version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webusb-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - webusb-network
    depends_on:
      - db

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - webusb-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-web_usb}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-webusb}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - webusb-network
    ports:
      - "3306:3306"

networks:
  webusb-network:
    driver: bridge

volumes:
  db-data:
