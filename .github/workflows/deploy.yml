name: Deploy Laravel App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VM
    runs-on: self-hosted

    steps:
      - name: Execute Deployment Commands
        run: |
          cd /home/andri/webusb
          git pull origin main
          
          # Pastikan menggunakan composer terbaru dengan memaksa IPv4 (agar tidak macet saat download)
          if [ ! -f "composer.phar" ]; then
            curl -4 -sS https://getcomposer.org/installer | php8.4
          fi
          
          php8.4 composer.phar install --no-interaction --prefer-dist --optimize-autoloader
          php8.4 artisan migrate --force
          php8.4 artisan optimize:clear
